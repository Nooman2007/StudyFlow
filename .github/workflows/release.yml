name: Build and Release StudyFlow

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release assets
        shell: powershell
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/Nooman2007/StudyFlow/releases/tags/${{ github.ref_name }}" `
            -Headers $headers

          Write-Host "Release found: $($release.tag_name)"
          Write-Host "Assets currently on GitHub:"

          foreach ($asset in $release.assets) {
            Write-Host " - $($asset.name)"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}